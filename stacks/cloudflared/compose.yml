# Cloudflare Tunnel: the only way in from outside the house. It opens no ports.
# The tunnel is managed from the Cloudflare dashboard (Zero Trust > Networks > Tunnels): each
# Public Hostname points to https://caddy:443 with its Origin Server Name. Currently only: brain.
name: cloudflared

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    container_name: cloudflared
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file:
      - ./cloudflared.env # Link to /opt/homelab/secrets/cloudflared.env (TUNNEL_TOKEN), created by the deploy script
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: 64m
    labels:
      diun.enable: "true"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  proxy:
    external: true

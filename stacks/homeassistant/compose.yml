services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.1
    container_name: homeassistant
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - /opt/homelab/datos/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Madrid
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  proxy:
    external: true

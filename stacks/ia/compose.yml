# Nothing leaves the house. Not meant for chatting: only for private documents.
name: ia

services:
  ollama:
    image: ollama/ollama:0.40.16
    container_name: ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 2m
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      TZ: Europe/Madrid
    volumes:
      - /opt/homelab/datos/ollama:/root/.ollama
    networks: [ia, proxy]
    cpus: "3.0"
    mem_limit: 1024m
    security_opt:
      - no-new-privileges:true
    labels:
      homelab.pesado: "true"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  ia:
    name: ia
  proxy:
    external: true

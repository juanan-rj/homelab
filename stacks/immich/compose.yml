# Fotos en el disco USB (si no está montado, NO arranca). Sin reconocimiento de caras (my choice).
# Ajustes como código en fotos/immich.json (la web no permite cambiarlos).
name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3.4.1
    restart: unless-stopped
    env_file: .env
    environment:
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      IMMICH_CONFIG_FILE: /config/immich.json
      IMMICH_TRUSTED_PROXIES: 172.16.0.0/12
      TZ: Europe/Madrid
    volumes:
      - type: bind
        source: /mnt/usb/fotos/immich
        target: /data
        bind:
          create_host_path: false
      - ../../fotos/immich.json:/config/immich.json:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_started
    networks: [interna, proxy]
    cpus: "3.0"
    mem_limit: 1024m
    security_opt:
      - no-new-privileges:true
    labels:
      homelab.pesado: "false"
    healthcheck:
      disable: false
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    networks: [interna]
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - /opt/homelab/datos/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    networks: [interna]
    mem_limit: 512m
    healthcheck:
      disable: false
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  interna:
    name: immich-interna
  proxy:
    external: true

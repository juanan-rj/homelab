name: media

services:
  jellyfin:
    image: jellyfin/jellyfin:12.4
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - TZ=Europe/Madrid
      - JELLYFIN_PublishedServerUrl=https://cine.example.com
    volumes:
      - /opt/homelab/datos/jellyfin/config:/config
      - /opt/homelab/datos/jellyfin/cache:/cache
      - /mnt/usb/media/peliculas:/media/peliculas
      - /mnt/usb/media/series:/media/series
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "992"
      - "44"
    networks:
      - proxy
    cpus: "3.0"
    mem_limit: 2048m
    healthcheck:
      test: ["CMD", "curl", "-Lk", "-fsS", "http://localhost:8096/health"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    labels:
      diun.enable: "true"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.3.0_v2.1.2-ls487
    container_name: qbittorrent
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - /opt/homelab/datos/qbittorrent/config:/config
      - /mnt/usb/media:/media
    ports:
      - "6881:6881/tcp"
      - "6881:6881/udp"
    networks:
      - proxy
    cpus: "2.0"
    mem_limit: 768m
    labels:
      diun.enable: "true"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.7.0.5723-ls168
    container_name: prowlarr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9696/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /opt/homelab/datos/prowlarr/config:/config
    networks:
      - proxy
    mem_limit: 512m
    labels:
      diun.enable: "true"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  radarr:
    image: lscr.io/linuxserver/radarr:7.0.3.10918-ls328
    container_name: radarr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:7878/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /opt/homelab/datos/radarr/config:/config
      - /mnt/usb/media:/media
    networks:
      - proxy
    mem_limit: 512m
    labels:
      diun.enable: "true"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls5
    container_name: sonarr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8989/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /opt/homelab/datos/sonarr/config:/config
      - /mnt/usb/media:/media
    networks:
      - proxy
    mem_limit: 512m
    labels:
      diun.enable: "true"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:v3.5.2
    init: true
    container_name: jellyseerr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5055/api/v1/settings/public"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Madrid
      - PORT=5055
    volumes:
      - /opt/homelab/datos/jellyseerr/config:/app/config
    networks:
      - proxy
    mem_limit: 256m
    labels:
      diun.enable: "true"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  proxy:
    external: true

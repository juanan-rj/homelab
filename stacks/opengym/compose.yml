name: opengym

# Shared api and web variables: written once, each service includes them with <<.
x-opengym-env: &opengym-env
  PORT: "3000"
  RP_ID: gym.example.com
  ORIGIN: https://gym.example.com
  RP_NAME: OpenGym
  DEFAULT_LANG: es
  FIRST_USER_ADMIN: "1"
  PASSWORD_LOGIN: "1"
  ALLOW_GUEST: "0"
  MEDIA_UPLOADS: "1"
  MEDIA_QUOTA_MB: "250"
  MEDIA_UPLOAD_MAX: 48m

services:
  api:
    image: ghcr.io/duartesantos8/opengym-api:1.4.5
    container_name: opengym-api
    restart: unless-stopped
    environment:
      <<: *opengym-env
      DATA_DIR: /data
      TRUST_PROXY: "1"
    volumes:
      - /opt/homelab/datos/opengym/data:/data
      - /opt/homelab/datos/opengym/coach-auth:/coach-auth
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  web:
    image: ghcr.io/duartesantos8/opengym-web:1.4.5
    container_name: opengym-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      <<: *opengym-env
      NGINX_PORT: "80"
      BACKEND: api
    networks:
      - internal
      - proxy
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  internal:
    driver: bridge
  proxy:
    external: true

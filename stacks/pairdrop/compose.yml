name: pairdrop

services:
  pairdrop:
    image: lscr.io/linuxserver/pairdrop:v1.11.2-ls150
    container_name: pairdrop
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - WS_FALLBACK=true
      - RTC_CONFIG=
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    labels:
      diun.enable: "true"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  proxy:
    external: true

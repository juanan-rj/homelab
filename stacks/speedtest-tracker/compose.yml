name: speedtest-tracker

services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:v1.15.1-ls181
    container_name: speedtest-tracker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/api/healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    env_file:
      - .env
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - APP_URL=https://speed.example.com
      - DB_CONNECTION=sqlite
      - SPEEDTEST_SCHEDULE=0 */2 * * *
    volumes:
      - /opt/homelab/datos/speedtest-tracker/config:/config
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  proxy:
    external: true
